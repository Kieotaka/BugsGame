    <style>
        body { font-family: sans-serif; padding: 16px; }
        h2 { color: #2e7d32; }
        ul { line-height: 1.6; }
    </style>
</head>
<body>
<h2>Правила игры «Жуки»</h2>
<ul>
    <li>Насекомые бегают по экрану.</li>
    <li>Нажми на жука — он уничтожен, тебе начисляются очки.</li>
    <li>Промахнулся — штраф.</li>
    <li>Обычный жук — 1 очко, быстрый — 3, редкий — 10.</li>
    <li>Раунд длится до истечения таймера.</li>
    <li>В конце — очки, попадания, промахи, точность.</li>
</ul>
</body>
